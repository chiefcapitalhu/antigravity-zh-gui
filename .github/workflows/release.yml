name: Build release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Build and checksum four desktop binaries
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bash scripts/build-release.sh dist "${GITHUB_REF_NAME#v}"
          else
            bash scripts/build-release.sh dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-zh-gui
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: antigravity-zh-gui
          path: dist
      - name: Publish verified assets for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" antigravity-zh-gui-* SHA256SUMS.txt
