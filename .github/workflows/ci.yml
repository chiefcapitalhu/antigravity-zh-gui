name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Go 1.22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go version
      - name: Verify the module has no dependencies
        shell: bash
        run: test "$(go list -m all)" = "antigravity-zh-gui"
      - run: go vet ./...
      - run: go test -count=1 -v ./...
      - run: go build ./...
      - name: Native menu and runtime policy regressions
        run: node --test tests/native.test.cjs tests/runtime-policy.test.cjs
      - name: Offline browser DOM regressions
        run: node tests/browser.cjs
