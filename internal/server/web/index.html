<!doctype html>
<html lang="zh-CN" data-skin="anime">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Antigravity 可视化汉化工具</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230096fa'/%3E%3Cpath d='M22 10v13m0-6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 1 1 13 0' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='6' r='3' fill='%23fb7299'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/panel.css">
    <script src="/panel.js" defer></script>
  </head>
  <body>
    <svg class="symbol-bank" aria-hidden="true" width="0" height="0">
      <defs>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5M3 18l9 5 9-5"/></symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h5l3-7 4 14 3-7h5"/></symbol>
        <symbol id="i-language" viewBox="0 0 24 24"><path d="M3 5h12M9 2v3m4 0c-1 6-4 9-9 12m2-9c1 3 4 5 7 7m1 6 4-10 4 10m-6-3h4"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2V4Zm9 2v15"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1.5"/><path d="M5 8v12h14V8m-10 4h6"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5-3 8-8 11-5-3-8-6-8-11V5l8-3Z"/><path d="m8.5 11.8 2.2 2.3 4.8-5"/></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 7h8m4 0h6M3 17h3m4 0h11"/><circle cx="13" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 3 3-3 3m6 0h5"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m5 18 5-5 3 3 3-4 4 5"/></symbol>
        <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H5v16h5m-1-8h12m-4-4 4 4-4 4"/></symbol>
        <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-40 12 12)"/><circle cx="12" cy="12" r="5"/></symbol>
      </defs>
    </svg>
    <header class="mast">
      <div class="bar">
        <div class="identity">
          <h1 aria-label="Antigravity 中文台">
            <svg class="wordmark" viewBox="0 0 159 35" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 12v13m0-6.5a6 6.5 0 1 1-12 0 6 6.5 0 1 1 12 0ZM21 25V12m0 6c0-8 12-9 12 0v7m10-20v16q0 5 6 4m-11-13h11m7 0v13m19-13v13q0 8-10 6m10-13a6 6.5 0 1 1-12 0 6 6.5 0 1 1 12 0Zm7-6v13m0-7q1-7 8-6m17 0v13m0-6.5a6 6.5 0 1 1-12 0 6 6.5 0 1 1 12 0Zm6-6.5 5 13 6-13m6 0v13m10-20v16q0 5 5 4m-10-13h10m3 0 5 13m5-13-7 19"/>
              <g fill="currentColor" stroke="none"><circle cx="56" cy="5" r="2.6"/><circle cx="130" cy="5" r="2.6"/></g>
            </svg>
            <span class="brand-pill">中文台</span>
            <span class="minimal-brand"><svg class="icon" aria-hidden="true"><use href="#i-orbit"></use></svg>Antigravity 中文台</span>
          </h1>
          <span id="version" class="version"></span>
        </div>
        <nav aria-label="控制台选项">
          <span class="offline"><i></i>纯本地离线</span>
          <button id="skinToggle" type="button" aria-label="二次元风皮肤" aria-pressed="true">✦ 二次元风</button>
          <button id="quit" type="button" class="subtle"><svg class="icon" aria-hidden="true"><use href="#i-exit"></use></svg>退出工具</button>
        </nav>
      </div>
    </header>
    <main>
      <div class="hero">
        <img id="heroImage" width="1024" height="319" alt="温暖工坊里的四位 AI 伙伴">
        <button id="heroToggle" type="button"><svg class="icon" aria-hidden="true"><use href="#i-image"></use></svg>切换头图</button>
      </div>
      <dl class="status-strip" aria-label="汉化状态概览">
        <div id="chip-clientVersion"><dt><svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg>客户端版本</dt><dd>待检测</dd></div>
        <div id="chip-running"><dt><svg class="icon" aria-hidden="true"><use href="#i-pulse"></use></svg>运行状态</dt><dd>待检测</dd></div>
        <div id="chip-localized"><dt><svg class="icon" aria-hidden="true"><use href="#i-language"></use></svg>汉化状态</dt><dd>待检测</dd></div>
        <div id="chip-catalog"><dt><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>内置词典</dt><dd>3,186 条</dd></div>
        <div id="chip-backup"><dt><svg class="icon" aria-hidden="true"><use href="#i-archive"></use></svg>归档备份</dt><dd>待检测</dd></div>
      </dl>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="grid">
        <section class="card environment">
          <div class="head">
            <h2><svg class="icon" aria-hidden="true"><use href="#i-pulse"></use></svg>环境体检</h2>
            <button type="button" id="refresh" class="subtle">重新检测</button>
          </div>
          <label for="target">客户端安装路径</label>
          <input id="target" type="text" spellcheck="false" placeholder="自动探测，也可输入安装目录">
          <p id="detected" class="hint path"></p>
          <dl class="facts compact-facts">
            <div>
              <dt>客户端版本</dt>
              <dd id="clientVersion">待检测</dd>
            </div>
            <div>
              <dt>运行状态</dt>
              <dd id="running">待检测</dd>
            </div>
            <div>
              <dt>汉化状态</dt>
              <dd id="localized">待检测</dd>
            </div>
            <div>
              <dt>归档备份</dt>
              <dd id="backup">待检测</dd>
            </div>
          </dl>
          <dl class="signature">
            <div>
              <dt id="sigLabel"><svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>签名状态</dt>
              <dd id="signature">待检测</dd>
            </div>
          </dl>
          <p id="health" class="hint" role="status"></p>
          <button id="restoreApp" class="subtle" hidden>从整包备份还原官方签名</button>
        </section>
        <section class="card options">
          <div class="head">
            <h2><svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>一键操作</h2>
            <button type="button" id="save" class="subtle">保存设置</button>
          </div>
          <div class="pair">
            <label>
              默认界面语言
              <select id="lang">
                <option value="zh">简体中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label>
              左上角品牌
              <select id="brand">
                <option value="keep">保留 Antigravity</option>
                <option value="hide">隐藏品牌</option>
              </select>
            </label>
          </div>
          <label class="switchrow">
            <span>
              软件内切换中英文
              <kbd id="shortcut">Ctrl + Shift + L</kbd>
            </span>
            <input type="checkbox" role="switch" id="hotkey" checked>
          </label>
          <label class="switchrow" id="backupRow">
            <span>保留官方签名的 .app 整包备份</span>
            <input type="checkbox" role="switch" id="makeBackup">
          </label>
          <div class="actionbar">
            <button id="apply" type="button" class="primary">一键汉化 / 更新</button>
            <button id="restore" type="button">一键还原官方英文</button>
            <button id="verify" type="button">验证文件完整性</button>
          </div>
        </section>
      </div>
      <section class="card eventcard">
        <div class="head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-terminal"></use></svg>操作日志</h2>
          <span class="live" id="jobState" aria-live="polite">等待操作</span>
        </div>
        <div id="logs" class="logs" role="log" aria-live="polite">
          <p class="empty">操作开始后，这里会显示每一步和用时。</p>
        </div>
        <details class="audit" id="audit">
          <summary>
            安全透明审计
            <span id="auditCount"></span>
          </summary>
          <div id="changes">
            <p class="hint">执行汉化或验证后可查看归档成员及 SHA-256。</p>
          </div>
        </details>
      </section>
      <section class="card words">
        <div class="head">
          <div>
            <h2><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>自定义词条</h2>
            <p class="hint">保存后重新汉化，个人译文将优先用于已识别的界面控件。</p>
          </div>
          <span class="count" id="wordCount"></span>
        </div>
        <form id="wordForm">
          <label>
            英文原文
            <input id="english" required placeholder="New Conversation" spellcheck="false">
          </label>
          <label>
            中文译文
            <input id="chinese" required placeholder="新建对话">
          </label>
          <button id="addWord">保存词条</button>
        </form>
        <ul id="wordList"></ul>
      </section>
    </main>
    <noscript>请在浏览器中启用 JavaScript 以使用本地控制台。</noscript>
  </body>
</html>
